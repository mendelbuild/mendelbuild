{{define "page-content"}}
<h1>Your Projects</h1>

<div class="card">
    {{if .Projects}}
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Created</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .Projects}}
            <tr>
                <td>{{.Project.Name}}</td>
                <td><span class="status status-{{if eq .Role "owner"}}active{{else}}pending{{end}}">{{.Role}}</span></td>
                <td>{{.Project.CreatedAt.Format "2006-01-02 15:04"}}</td>
                <td>
                    <a href="/p/{{.Project.ID}}/strategy">View Strategy</a>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
    {{else}}
    <p class="empty">No projects yet. Use <code>mendel load-strategy &lt;file.json&gt;</code> to create one.</p>
    {{end}}
</div>
{{end}}
