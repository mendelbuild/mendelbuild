{{define "page-content"}}
<h1>Roadmap: {{.Strategy.Name}}</h1>

<div class="card" style="overflow: hidden; position: relative;">
    <div style="position: absolute; top: 8px; right: 12px; font-size: 11px; color: #999; z-index: 10;">
        Scroll or drag to pan, pinch or shift-scroll to zoom
    </div>
    <div id="roadmap-container" style="min-height: 400px; position: relative; cursor: grab;">
        <div id="roadmap-loading" style="text-align: center; padding: 50px; color: #666;">
            Loading roadmap...
        </div>
    </div>
</div>

<script src="https://unpkg.com/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="/static/js/roadmap-view.js"></script>
<script>
(function() {
    // The same renderer draws the small panel embedded on Hop and Variation
    // pages, so the two can never disagree about what the roadmap looks like.
    function draw() {
        RoadmapView.render(document.getElementById('roadmap-container'), {
            hops: {{.HopsJSON}} || [],
            edges: {{.EdgesJSON}} || [],
            projectID: "{{.ProjectID}}",
        });
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', draw);
    } else {
        draw();
    }
})();
</script>
{{end}}
