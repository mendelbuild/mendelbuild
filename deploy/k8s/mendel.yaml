apiVersion: apps/v1
kind: Deployment
metadata:
  name: mendel
  namespace: mendel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mendel
  template:
    metadata:
      labels:
        app: mendel
    spec:
      terminationGracePeriodSeconds: 5
      containers:
      - name: mendel
        image: MENDEL_IMAGE_PLACEHOLDER
        env:
        - name: MENDEL_DB_URL
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: database-url
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: anthropic-api-key
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: google-client-id
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: google-client-secret
        - name: MENDEL_BASE_URL
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: base-url
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: session-secret
        - name: MENDEL_CREDENTIAL_KEY
          valueFrom:
            secretKeyRef:
              name: mendel-secret
              key: credential-key
        - name: MENDEL_WORK_DIR
          value: "/work"
        - name: DOCKER_HOST
          value: "tcp://localhost:2375"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: work
          mountPath: /work
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: dind
        image: docker:24-dind
        securityContext:
          privileged: true
        env:
        - name: DOCKER_TLS_CERTDIR
          value: ""
        volumeMounts:
        - name: work
          mountPath: /work
        - name: dind-storage
          mountPath: /var/lib/docker
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "1500m"
      volumes:
      - name: work
        persistentVolumeClaim:
          claimName: mendel-work
      - name: dind-storage
        emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mendel-work
  namespace: mendel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mendel
  namespace: mendel
spec:
  selector:
    app: mendel
  ports:
  - port: 80
    targetPort: 8080
